<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Corps de la puce SPI (dégradé ardoise, cf. k5viewer) -->
        <linearGradient id="fmChip" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#334155" />
            <stop offset="100%" style="stop-color:#1e293b" />
        </linearGradient>
    </defs>
    <!-- Pins de la puce flash (rime avec uvtools2) -->
    <g stroke="#64748b" stroke-width="2.5">
        <line x1="2" y1="8"  x2="6.5" y2="8"/>
        <line x1="2" y1="14" x2="6.5" y2="14"/>
        <line x1="2" y1="20" x2="6.5" y2="20"/>
        <line x1="2" y1="26" x2="6.5" y2="26"/>
        <line x1="25.5" y1="8"  x2="30" y2="8"/>
        <line x1="25.5" y1="14" x2="30" y2="14"/>
        <line x1="25.5" y1="20" x2="30" y2="20"/>
        <line x1="25.5" y1="26" x2="30" y2="26"/>
    </g>
    <!-- Boîtier -->
    <rect x="6.5" y="4" width="19" height="24" rx="2.5" fill="url(#fmChip)" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Carte des régions : bandes empilées (couleurs de la page flash-map) -->
    <rect x="8.5" y="6"    width="15" height="3.2" rx="0.7" fill="#3b82f6"/>  <!-- shared / config -->
    <rect x="8.5" y="10.2" width="15" height="3.2" rx="0.7" fill="#22c55e"/>  <!-- slots firmware -->
    <rect x="8.5" y="14.4" width="15" height="3.2" rx="0.7" fill="#a855f7"/>  <!-- voice / profils -->
    <rect x="8.5" y="18.6" width="15" height="3.2" rx="0.7" fill="#06b6d4"/>  <!-- apps -->
    <rect x="8.5" y="22.8" width="15" height="3.2" rx="0.7" fill="#f59e0b"/>  <!-- log RX/TX -->
</svg>
